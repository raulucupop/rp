[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-hex-tool"
version = "0.1.0"
description = "Project/profile driven Intel HEX patch and read-back tool"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rp-hex = "rp_hex_tool.cli:main"
rp-hex-gui = "rp_hex_tool.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
